[project]
name = "mammoth-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyrefly==1.0.*",
    "pytest>=8.0.0",
]

[project.scripts]
mammoth-db = "mammoth_db.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["mammoth_db"]

[tool.pyrefly]
project-includes = [
    "mammoth_db/*.py",
    "mammoth_db/**/*.py",
    "tests/*.py",
    "tests/**/*.py",
    "**/*.ipynb",
]
search-path = ["."]
python-interpreter-path = ".venv/bin/python"
